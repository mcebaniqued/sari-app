name: Retire closed PR previews

on:
  pull_request:
    types: [closed]
    branches: [staging]

permissions:
  contents: read

# Serialize API trusted-origin changes with the future PR creation workflow.
concurrency:
  group: sari-pr-preview-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Use trusted staging code, never the closed PR's branch.
      - name: Checkout staging
        uses: actions/checkout@v7
        with:
          ref: staging
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Remove PR domain and trusted origin
        run: node scripts/cleanup-pr-preview.mjs
        env:
          VERCEL_WEB_TOKEN: ${{ secrets.VERCEL_PREVIEW_WEB_TOKEN }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_PREVIEW_API_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
